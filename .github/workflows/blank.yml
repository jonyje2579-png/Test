name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Fetch proot from Termux repo
      run: |
        # Скачиваем proot и его зависимости из репозитория Termux
        mkdir -p app/src/main/jniLibs/arm64-v8a
        cd app/src/main/jniLibs/arm64-v8a
        wget https://github.com/termux/termux-packages/releases/download/proot-5.1.107-1/proot_5.1.107_aarch64.deb
        ar x proot_5.1.107_aarch64.deb
        tar xf data.tar.xz
        mv data/data/com.termux/files/usr/bin/proot ./libproot.so
        # (Клод также писал про patchelf и libtalloc, но начнем с простого)
      continue-on-error: true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.9

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ProotSpike-apk
        path: app/build/outputs/apk/debug/*.apk
