name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать zip, если исходники в архиве
        run: |
          if ! find . -maxdepth 3 -name 'settings.gradle*' -not -path './.git/*' | grep -q .; then
            for z in ./*.zip; do
              echo "Распаковка $z"
              unzip -o -q "$z" -d _src
            done
          fi

      - name: Найти Gradle-проект
        run: |
          ls -la
          find . -maxdepth 4 -not -path './.git/*' | sort | head -80
          S=$(find . -maxdepth 4 \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -not -path './.git/*' | head -1)
          if [ -z "$S" ]; then
            echo "::error::settings.gradle.kts не найден. Смотри дерево выше."
            exit 1
          fi
          DIR=$(cd "$(dirname "$S")" && pwd)
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Свои бинарники (extra-libs/)
        run: |
          if ls extra-libs/*.so >/dev/null 2>&1; then
            J="$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a"
            mkdir -p "$J"
            cp extra-libs/*.so "$J/"
            echo "MANUAL_LIBS=1" >> "$GITHUB_ENV"
            ls -la "$J"
          fi

      - name: Fetch proot from Termux repo
        if: env.MANUAL_LIBS != '1'
        continue-on-error: true
        run: |
          set -eux
          sudo apt-get update -y
          sudo apt-get install -y patchelf binutils xz-utils
          BASE=https://packages.termux.dev/apt/termux-main/pool/main
          latest() { curl -fsSL "$BASE/$1/" | grep -oE '[A-Za-z0-9_.+-]+_aarch64\.deb' | sort -uV | tail -1; }
          mkdir -p /tmp/t && cd /tmp/t
          P=$(latest p/proot); T=$(latest libt/libtalloc)
          curl -fsSLO "$BASE/p/proot/$P"
          curl -fsSLO "$BASE/libt/libtalloc/$T"
          for d in "$P" "$T"; do ar x "$d"; tar xf data.tar.xz; done
          U=data/data/com.termux/files/usr
          J="$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$J"
          cp "$U/bin/proot" "$J/libproot.so"
          cp "$U/libexec/proot/loader" "$J/libproot-loader.so"
          cp -L "$U/lib/libtalloc.so.2" "$J/libtalloc.so"
          cd "$J"
          readelf -d libproot.so | grep -E 'NEEDED|RPATH|RUNPATH' || true
          patchelf --replace-needed libtalloc.so.2 libtalloc.so libproot.so
          patchelf --remove-rpath libproot.so || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ProotSpike-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
